<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | Rendezvous Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark">R</span>
      <span class="brand-text"><span class="name">Rendezvous</span><br><span class="tag">RESTAURANT</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
    </nav>
    <div class="nav-right"></div>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card staff card">
    <div class="auth-head">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--purple)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <h2>Staff Login</h2>
      <p>Access admin panel</p>
    </div>

    <div class="form-alert" id="formAlert"></div>

    <form id="staffLoginForm" novalidate>
      <div class="field" id="f-email">
        <label for="email">Email</label>
        <div class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>
          <input type="email" id="email" placeholder="Email">
        </div>
        <div class="field-error">Please enter your email.</div>
      </div>
      <div class="field" id="f-password">
        <label for="password">Password</label>
        <div class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="Password">
          <button type="button" class="toggle-pw" data-toggle="password">Show</button>
        </div>
        <div class="field-error">Please enter your password.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    
  </div>
</main>

<script src="script.js"></script>
<script>


var form = document.getElementById("staffLoginForm");
var alertBox = document.getElementById("formAlert");

document.querySelector('[data-toggle="password"]').addEventListener("click", function (event) {
  var passwordInput = document.getElementById("password");
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    event.target.textContent = "Hide";
  } else {
    passwordInput.type = "password";
    event.target.textContent = "Show";
  }
});

form.addEventListener("submit", function (event) {
  event.preventDefault();

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;

  document.getElementById("f-email").classList.remove("invalid");
  document.getElementById("f-password").classList.remove("invalid");

  var formIsValid = true;
  if (isValidEmail(email) === false) {
    document.getElementById("f-email").classList.add("invalid");
    formIsValid = false;
  }
  if (password === "") {
    document.getElementById("f-password").classList.add("invalid");
    formIsValid = false;
  }
  if (formIsValid === false) {
    return;
  }

  var result = loginStaff(email, password);

  if (result.success === false) {
    alertBox.textContent = result.message;
    alertBox.className = "form-alert show error";
    return;
  }

  if (result.role === "admin") {
    window.location.href = "admin-dashboard.html";
  } else {
    window.location.href = "staff-orders.html";
  }
});
</script>
</body>
</html>
