<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Rendezvous Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark">R</span>
      <span class="brand-text"><span class="name">Rendezvous</span><br><span class="tag">RESTAURANT</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="order.html">Order</a>
      <a href="reservation.html">Reserve</a>
      <a href="account.html">My Account</a>
    </nav>
    <div class="nav-right">
      <a href="order.html" class="cart-pill">🛒 <span class="count" id="cartCount">0</span></a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main class="page-wrap">
  <section class="section">
    <div class="container">
      <div class="section-head">
        <h2>My Orders</h2>
        <p>Every takeaway order you've placed while logged in.</p>
      </div>

      <div class="panel card">
        <table class="data-table">
          <thead><tr><th>Order ID</th><th>Items Ordered</th><th>Total</th><th>Pickup</th><th>Status</th></tr></thead>
          <tbody id="myOrdersBody"><!-- filled by JS --></tbody>
        </table>
      </div>

      <p style="margin-top:18px;"><a href="account.html" style="color:var(--purple); font-weight:600;">&larr; Back to My Account</a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  
</footer>

<script src="script.js"></script>
<script>
var customer = protectCustomerPage();

if (customer !== null) {

    async function loadMyOrders() {

        try {

            var response = await fetch(
                "/api/customer/orders/" + encodeURIComponent(customer.email)
            );

            var rows = await response.json();

            var orders = [];

            for (var i = 0; i < rows.length; i++) {

                var row = rows[i];

                var existingOrder = null;

                for (var j = 0; j < orders.length; j++) {
                    if (orders[j].order_id === row.order_id) {
                        existingOrder = orders[j];
                        break;
                    }
                }

                if (existingOrder === null) {

                    existingOrder = {
                        order_id: row.order_id,
                        pickup_date: row.pickup_date,
                        pickup_time: row.pickup_time,
                        order_status: row.order_status,
                        total_amount: row.total_amount,
                        items: []
                    };

                    orders.push(existingOrder);
                }

                existingOrder.items.push(
                    row.item_name + " x " + row.quantity
                );
            }

            var html = "";

            for (var k = 0; k < orders.length; k++) {

                var order = orders[k];

                html += "<tr>";

                html += "<td>#" + order.order_id + "</td>";

                html += "<td>" + order.items.join(", ") + "</td>";

                html += "<td>R" + Number(order.total_amount).toFixed(2) + "</td>";

                html += "<td>" +
                    order.pickup_date + ", " +
                    order.pickup_time +
                    "</td>";

                html += '<td><span class="status-pill ' +
                    order.order_status.toLowerCase() +
                    '">' +
                    order.order_status +
                    "</span></td>";

                html += "</tr>";
            }

            if (orders.length === 0) {

                html =
                    '<tr><td colspan="5" style="color:var(--text-muted)">' +
                    'You haven\'t placed any orders yet. ' +
                    '<a href="menu.html">Browse the menu</a>.' +
                    '</td></tr>';
            }

            document.getElementById("myOrdersBody").innerHTML = html;

        } catch (error) {

            console.error("Could not load customer orders:", error);

            document.getElementById("myOrdersBody").innerHTML =
                '<tr><td colspan="5">Could not load your orders.</td></tr>';
        }
    }

    loadMyOrders();

}
</script>
</body>
</html>
